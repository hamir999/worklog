<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>업무 기록</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2E5A4B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="업무기록">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#FBFBFA;--sf:#FFF;--ink:#1A1A19;--mut:#8A8D86;--faint:#B5B8B1;--line:#E8E8E4;--soft:#F4F4F1;
 --ac:#3D4A42;--acs:#ECEFEB;--hi:#B8873A;--r:4px;--hh:96px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
 font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;
 padding-bottom:calc(52px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
input,textarea{font:inherit;color:inherit}

/* 머리 */
header{position:sticky;top:0;z-index:20;background:var(--sf);border-bottom:1px solid var(--line);
 padding-top:env(safe-area-inset-top)}
.top,.days,.find{max-width:820px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px 6px}
.st{flex:1;min-width:0;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis;letter-spacing:.01em}
.st.err{color:var(--hi)}
.tb{font-size:13px;color:var(--mut);padding:4px 0;white-space:nowrap}
.tb:hover{color:var(--ink)}
.tb.pr{color:var(--ac);font-weight:600}
.find{display:flex;gap:12px;align-items:center;padding:2px 18px 10px}
.find input{flex:1;min-width:0;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r);
 background:var(--soft);font-size:15px}
.find input:focus{outline:none;background:var(--sf);border-color:#B6BAB2}

/* 탭: 모바일은 아래 고정, 넓은 화면은 머리 안 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--sf);
 border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 0 13px;font-size:13.5px;color:var(--mut)}
nav button.on{color:var(--ink);font-weight:600}

/* 날짜 띠 */
.days{display:flex;padding:0 10px 8px}
.d{flex:1;min-width:0;padding:4px 0 5px;text-align:center;border-bottom:2px solid transparent;
 font-size:10.5px;color:var(--mut);line-height:1.25}
.d b{display:block;font-size:14px;font-weight:500}
.d.td{color:var(--ac)}
.d.on{border-bottom-color:var(--ink);color:var(--ink)}
.d.on b{font-weight:600}
.d i{display:block;width:3px;height:3px;border-radius:50%;margin:3px auto 0}
.d.has i{background:#C9CCC4}
.d.on.has i{background:var(--ink)}
.d.nav{flex:0 0 26px;font-size:15px;color:#BFC2BA;border-bottom:none;display:flex;align-items:center;justify-content:center}
.d.nav:hover{color:var(--ink)}

main{padding:16px 18px 0;max-width:820px;margin:0 auto}
.bar{font-size:12px;color:var(--mut);margin-bottom:14px;letter-spacing:.01em}
.empty{color:#A9ACA5;font-size:13.5px;text-align:center;padding:40px 14px;line-height:1.8}
.warn{background:#F4EDDC;border:1px solid #E4D6B4;color:#5C4914;border-radius:var(--r);
 padding:10px 12px;font-size:13px;margin-bottom:12px}
textarea{resize:none;overflow:hidden;line-height:1.6}
.btn{display:block;width:100%;padding:10px;border:1px solid var(--line);background:var(--sf);
 border-radius:var(--r);font-size:14px;text-align:center;color:var(--mut)}
.btn:hover{color:var(--ink);border-color:#D2D5CD}
.btn.pri{border-style:dashed}
.btn.sm{padding:7px 11px;font-size:13px}
.x{flex:0 0 auto;width:22px;height:22px;color:#D5D8D0;font-size:14px}
.x:hover{color:#8A8D86}

/* 할 일 */
.t{display:flex;gap:11px;align-items:flex-start;border-bottom:1px solid var(--line);padding:9px 2px}
.ck{flex:0 0 auto;width:17px;height:17px;border:1.3px solid #C6C9C1;border-radius:50%;
 margin-top:4px;font-size:10px;line-height:1;color:#fff}
.ck.on{background:var(--ac);border-color:var(--ac)}
.t textarea{border:none;padding:0;min-height:22px;background:none;flex:1;font-size:15px;width:100%}
.t textarea:focus{outline:none}
.t.done textarea{color:var(--faint);text-decoration:line-through}
.old{font-size:10.5px;color:var(--hi);flex:0 0 auto;margin-top:5px;white-space:nowrap;letter-spacing:.02em}

/* 기록 — 주간 보기 */
.wk{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut);letter-spacing:.01em}
.wk .sp,.dh .sp{flex:1}
.wk button{font-size:12.5px;color:var(--ac);font-weight:600}
.day{padding-bottom:4px}
.dh{position:sticky;top:var(--hh);z-index:5;background:var(--bg);display:flex;align-items:baseline;
 gap:7px;padding:16px 2px 7px;border-bottom:1px solid var(--line)}
.dh .dd{font-size:14.5px;font-weight:600}
.dh .dw{font-size:12px;color:var(--mut)}
.dh .tg{font-size:11px;color:var(--ac);font-weight:600}
.dh .add{font-size:12px;color:var(--faint);padding:2px 0 2px 8px}
.dh .add:hover{color:var(--ac)}
.day.none .dd{color:var(--faint);font-weight:500}
.day.none .dh{border-bottom-color:transparent;padding-bottom:2px}
.e{padding:10px 2px 12px;border-bottom:1px solid var(--line);transition:background 1.2s}
.e:last-child{border-bottom:none}
.e.flash,.t.flash{background:#F5EEDD;transition:none}
.eh{display:flex;align-items:center;gap:10px}
.tm{flex:0 0 auto;width:42px;border:none;background:none;padding:0;font-size:12px;font-weight:600;
 color:var(--mut);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.kd{flex:0 0 auto;font-size:11px;color:var(--faint);padding:1px 0;letter-spacing:.02em}
.kd:hover{color:var(--ac)}
.e.meet .kd{color:var(--ac);background:var(--acs);padding:1px 6px;border-radius:3px;font-weight:600}
.lab{flex:1;min-width:0;border:none;background:none;padding:0;font-size:14px;font-weight:600}
.e textarea{display:block;width:100%;border:none;background:none;padding:0;margin-top:3px;min-height:24px;font-size:15px}
.tm:focus,.lab:focus,.e textarea:focus{outline:none}
.lab::placeholder,.tm::placeholder{color:#C9CCC4;font-weight:500}
.e textarea::placeholder,.t textarea::placeholder{color:#C2C5BD}
.act{display:flex;gap:6px;margin-top:8px}
.act input{flex:1;min-width:0;padding:6px 9px;font-size:13.5px;background:var(--soft);
 border:1px solid transparent;border-radius:var(--r)}
.act input:focus{outline:none;background:var(--sf);border-color:var(--line)}
.act button{flex:0 0 auto;padding:6px 11px;border:1px solid var(--line);background:var(--sf);
 color:var(--mut);border-radius:var(--r);font-size:13px}
.act button:hover{color:var(--ac);border-color:#C6C9C1}
.tail{height:45vh}

/* 검색 결과 */
.sr{display:block;width:100%;text-align:left;padding:10px 2px 11px;border-bottom:1px solid var(--line)}
.sr:hover{background:#F6F6F4}
.sr .m{font-size:11.5px;color:var(--mut);letter-spacing:.01em}
.sr .s{font-size:14px;color:var(--ink);word-break:break-all}
.sr .s.b{font-weight:600}
mark{background:#F1E6CC;color:inherit;padding:0 1px;border-radius:2px}

/* 내보내기 시트 */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(20,22,19,.4);display:none}
.sheet.on{display:block}
.sheet .in{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--sf);
 border-radius:12px 12px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:16px}
.row{display:flex;gap:8px}
.lb{font-size:12px;color:var(--mut);margin:10px 0 4px}
.sheet input[type=text],.sheet input[type=date]{width:100%;padding:8px 10px;border:1px solid var(--line);
 border-radius:var(--r);background:var(--sf)}
#out{width:100%;min-height:220px;font-size:13px;line-height:1.6;white-space:pre;overflow:auto;margin-top:10px;
 padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);resize:vertical}
.info{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.7}
.info.err{color:var(--hi)}
.ver{font-size:11px;color:var(--faint);text-align:center;margin-top:16px;letter-spacing:.04em}

.toast{position:fixed;left:50%;bottom:calc(68px + env(safe-area-inset-bottom));transform:translateX(-50%);
 z-index:60;background:#2B2E2A;color:#fff;font-size:13px;padding:8px 14px;border-radius:6px;
 opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:.94}

@media (min-width:720px){
  body{padding-bottom:0}
  main{padding:22px 28px 0}
  nav{position:static;order:-1;border:none;padding:0;background:none;gap:20px;margin-right:8px}
  nav button{flex:0 0 auto;padding:4px 0;border-bottom:1.5px solid transparent}
  nav button.on{border-bottom-color:var(--ink)}
  .toast{bottom:28px}
}
</style>
</head>
<body>

<header id="hd">
  <div class="top">
    <nav id="nav">
      <button data-t="task" class="on">할 일</button>
      <button data-t="log">기록</button>
    </nav>
    <span class="st" id="st"></span>
    <button class="tb" id="todayBtn">오늘</button>
    <button class="tb" id="findBtn">검색</button>
    <button class="tb pr" id="syncBtn">동기화</button>
    <button class="tb pr" id="expBtn">내보내기</button>
  </div>
  <div class="find" id="find" hidden>
    <input type="search" id="q" placeholder="기록 · 회의 · 할 일 검색" autocomplete="off">
    <button class="tb" id="findClose">닫기</button>
  </div>
  <div class="days" id="days"></div>
</header>

<main id="view"></main>

<div class="sheet" id="sheet"><div class="in">
  <h2>내보내기</h2>
  <div class="row" style="margin-bottom:8px">
    <button class="btn sm" data-p="day" style="flex:1">선택한 날</button>
    <button class="btn sm" data-p="week" style="flex:1">그 주</button>
    <button class="btn sm" data-p="month" style="flex:1">그 달</button>
  </div>
  <div class="row" style="align-items:center;gap:6px">
    <input type="date" id="d1"><span style="color:var(--mut)">~</span><input type="date" id="d2">
    <button class="btn sm" data-p="range" style="flex:0 0 auto;width:auto">조회</button>
  </div>
  <textarea id="out" spellcheck="false"></textarea>
  <div class="row" style="margin-top:8px">
    <button class="btn" data-a="copy">복사</button>
    <button class="btn pri" data-a="file">파일 저장</button>
  </div>

  <div class="lb" style="margin-top:18px">동기화 주소 · 이 기기에만 저장됩니다</div>
  <input type="text" id="syncUrl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
  <div class="row" style="margin-top:8px">
    <button class="btn sm" data-a="saveUrl" style="flex:1">주소 저장</button>
    <button class="btn sm pri" data-a="syncNow" style="flex:1">지금 동기화</button>
  </div>
  <div class="info" id="syncInfo"></div>

  <div class="lb" style="margin-top:14px">백업</div>
  <div class="row">
    <button class="btn sm" data-a="backup" style="flex:1">백업(.json)</button>
    <button class="btn sm" data-a="restore" style="flex:1">불러오기</button>
    <button class="btn sm" data-a="close" style="flex:1;border:none">닫기</button>
  </div>
  <input type="file" id="fin" accept=".json,application/json" style="display:none">
  <div class="ver" id="ver"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
"use strict";
var VER="v8";
var KEY="work-log-v1",MKEY="work-log-meta",SYNKEY="worklog-sync-url",TABKEY="worklog-tab";
var NAMES=["tasks","logs","meets"],DOW=["일","월","화","수","목","금","토"];
var OPEN_GAP=10*60*1000;   /* 열거나 돌아왔을 때: 마지막 동기화가 10분 넘었으면 */
var RUN_GAP=60*60*1000;    /* 열어 두는 동안: 1시간마다 */
var S,M,tab="task",cur,ok=true,SYNC="",syncing=false,lastErr="",oldServer=false,pending=false,findOn=false;
try{SYNC=localStorage.getItem(SYNKEY)||"";tab=localStorage.getItem(TABKEY)==="log"?"log":"task"}catch(e){}

function $(id){return document.getElementById(id)}
function p2(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function dt(s){return new Date(s+"T00:00:00")}
function shift(s,n){var d=dt(s);d.setDate(d.getDate()+n);return iso(d)}
function md(s){var d=dt(s);return (d.getMonth()+1)+"/"+d.getDate()}
function fd(s){return s+" ("+DOW[dt(s).getDay()]+")"}
function hm(){var t=new Date();return p2(t.getHours())+":"+p2(t.getMinutes())}
function uid(){return Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function today(){return iso(new Date())}
function diff(a,b){return Math.round((dt(b)-dt(a))/86400000)}
function str(v){return v==null?"":String(v)}
function B(v){return v===true||v==="TRUE"||v==="true"}
function find(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}
function alive(a){return a.filter(function(x){return !x.del})}

/* ── 데이터 정리 ── */
/* 시트를 거치며 날짜/시간 값으로 바뀐 것을 원래 글자로 되돌림 */
function toDate_(v){
  var s=str(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  var d=new Date(s);
  return isNaN(d)?s:iso(d);
}
function toTime_(v){
  var s=str(v);
  if(!s)return "";
  if(/^\d{1,2}:\d{2}$/.test(s))return s.length===4?"0"+s:s;
  var d=new Date(s);
  if(isNaN(d))return s;
  return p2(d.getHours())+":"+p2(d.getMinutes());
}
var DEF={
  tasks:{date:"",text:"",done:false,doneDate:"",updated:0,del:false},
  logs:{date:"",t:"",label:"",text:"",kind:"log",updated:0,del:false},
  meets:{date:"",title:"",body:"",updated:0,del:false}
};
/* 들어온 칸만 정리 — 없는 칸은 건드리지 않음 */
function normOne(n,x){
  var o={id:String(x.id)},h=function(k){return Object.prototype.hasOwnProperty.call(x,k)};
  if(h("date"))o.date=toDate_(x.date);
  if(h("updated"))o.updated=Number(x.updated)||0;
  if(h("del"))o.del=B(x.del);
  if(n==="tasks"){
    if(h("text"))o.text=str(x.text);
    if(h("done"))o.done=B(x.done);
    if(h("doneDate"))o.doneDate=x.doneDate?toDate_(x.doneDate):"";
  }else if(n==="logs"){
    if(h("t"))o.t=toTime_(x.t);
    if(h("label"))o.label=str(x.label);
    if(h("text"))o.text=str(x.text);
    if(h("kind"))o.kind=x.kind==="meet"?"meet":"log";
  }else{
    if(h("title"))o.title=str(x.title);
    if(h("body"))o.body=str(x.body);
  }
  return o;
}
function fill(n,o){var d=DEF[n];for(var k in d)if(!(k in o))o[k]=d[k];return o}
function cleanAll(data){
  var r={tasks:[],logs:[],meets:[]};
  NAMES.forEach(function(n){(data&&data[n]||[]).forEach(function(x){if(x&&x.id)r[n].push(fill(n,normOne(n,x)))})});
  return r;
}
function sameItem(n,a,b){for(var k in DEF[n])if(k!=="updated"&&a[k]!==b[k])return false;return true}

/* 예전 회의 탭 항목을 기록(회의)으로 옮김. id를 고정해서 기기마다 옮겨도 중복되지 않음 */
function migrate(){
  var ch=false,now=Date.now(),ids={};
  S.logs.forEach(function(l){ids[l.id]=1});
  S.meets.forEach(function(m){
    if(m.del)return;
    var id="m"+m.id;
    if(!ids[id]){S.logs.push({id:id,date:m.date,t:"",label:m.title||"",text:m.body||"",kind:"meet",updated:now,del:false});ids[id]=1}
    m.del=true;m.updated=now;ch=true;
  });
  return ch;
}

/* ── 저장 ── */
function load(){
  try{
    var r=localStorage.getItem(KEY);
    S=cleanAll(r?JSON.parse(r):{});
    localStorage.setItem(KEY+"_t","1");localStorage.removeItem(KEY+"_t");
  }catch(e){ok=false;S={tasks:[],logs:[],meets:[]}}
  try{M=JSON.parse(localStorage.getItem(MKEY)||"{}")||{}}catch(e){M={}}
  M.lastSrv=Number(M.lastSrv)||0;M.lastPush=Number(M.lastPush)||0;M.lastSync=Number(M.lastSync)||0;
  if(migrate())store();
  cur=today();
}
function store(){if(!ok)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){ok=false}}
function saveMeta(){try{localStorage.setItem(MKEY,JSON.stringify(M))}catch(e){}}
function save(){store();status()}

/* ── 동기화 ── */
function dirtyOf(n){return S[n].filter(function(o){return (o.updated||0)>M.lastPush})}
function dirtyCount(){return dirtyOf("tasks").length+dirtyOf("logs").length+dirtyOf("meets").length}
function payload(){var p={v:VER,since:M.lastSrv};NAMES.forEach(function(n){p[n]=dirtyOf(n)});return p}

/* 서버에서 받은 것을 기기 데이터와 병합 — 통째로 바꾸지 않으므로 입력 중인 내용이 지워지지 않음 */
function mergeIn(data){
  var ch=false;
  NAMES.forEach(function(n){
    var idx={};S[n].forEach(function(o,i){idx[o.id]=i});
    (data&&data[n]||[]).forEach(function(x){
      if(!x||!x.id)return;
      var inc=normOne(n,x),i=idx[inc.id];
      if(i===undefined){S[n].push(fill(n,inc));idx[inc.id]=S[n].length-1;ch=true;return}
      var loc=S[n][i];
      if((inc.updated||0)<=(loc.updated||0))return;
      var nw=fill(n,Object.assign({},loc,inc));
      if(!sameItem(n,nw,loc)||nw.updated!==loc.updated){S[n][i]=nw;ch=true}
    });
  });
  if(migrate())ch=true;
  return ch;
}

function sync(loud){
  if(!SYNC){if(loud)alert("먼저 내보내기 화면에서 동기화 주소를 저장해 주세요.");return}
  if(syncing)return;
  syncing=true;lastErr="";status();
  var start=Date.now(),body=JSON.stringify(payload());
  fetch(SYNC,{method:"POST",body:body})
    .then(function(r){return r.json()})
    .then(function(j){
      if(!j||!j.ok)throw new Error(j&&j.error?j.error:"응답 오류");
      oldServer=!("now" in j);
      var ch=mergeIn(j.data||{});
      if(!oldServer)M.lastSrv=Number(j.now)||M.lastSrv;
      M.lastPush=start;M.lastSync=Date.now();saveMeta();store();
      syncing=false;status();
      if(ch)refresh();
      if(loud&&oldServer)alert("동기화는 됐지만 앱스크립트가 예전 버전입니다.\n새 앱스크립트로 바꿔야 제목이 시트에 저장됩니다.");
    })
    .catch(function(err){
      syncing=false;lastErr=String(err&&err.message||err);status();
      if(loud)alert("동기화에 실패했습니다.\n주소가 맞는지, 인터넷이 되는지 확인해 주세요.\n\n"+lastErr);
    });
}
/* 창을 닫을 때 바뀐 것만 조용히 올림 */
function push(){
  if(!SYNC||syncing||!dirtyCount())return;
  var body=JSON.stringify(payload());
  if(body.length>60000)return;   /* 전송 한도를 넘으면 다음 동기화 때 보냄 */
  try{if(navigator.sendBeacon&&navigator.sendBeacon(SYNC,body))return}catch(e){}
  try{fetch(SYNC,{method:"POST",body:body,keepalive:true,mode:"no-cors"}).catch(function(){})}catch(e){}
}
function auto(gap){
  if(!SYNC||syncing||document.visibilityState!=="visible")return;
  if(navigator.onLine===false)return;
  if(!S.tasks.length&&!S.logs.length){sync(false);return}   /* 기기가 비어 있으면 서버에서 복구 */
  if(Date.now()-M.lastSync>gap)sync(false);
}

function ago(ms){
  var m=Math.round((Date.now()-ms)/60000);
  if(m<1)return "방금";if(m<60)return m+"분 전";
  var h=Math.floor(m/60);if(h<24)return h+"시간 전";
  var d=new Date(ms);return (d.getMonth()+1)+"/"+d.getDate();
}
function stamp(ms){var d=new Date(ms);return (d.getMonth()+1)+"/"+d.getDate()+" "+p2(d.getHours())+":"+p2(d.getMinutes())}
function status(){
  var el=$("st"),c=false,t,n=dirtyCount();
  if(!ok){t="자동 저장이 막혀 있음";c=true}
  else if(!SYNC)t="동기화 주소 없음";
  else if(syncing)t="동기화 중…";
  else if(oldServer){t="앱스크립트 업데이트 필요";c=true}
  else if(lastErr){t="동기화 실패"+(n?" · 미전송 "+n:"");c=true}
  else t=(M.lastSync?"동기화 "+ago(M.lastSync):"동기화 전")+(n?" · 미전송 "+n:"");
  el.textContent=t;el.classList.toggle("err",c);
}
function syncInfo(){
  var el=$("syncInfo"),n=dirtyCount(),L=[];
  if(!SYNC)L.push("주소를 저장하면 열 때와 1시간마다 자동으로 동기화합니다.");
  else{

    L.push("열 때(10분 경과 시)·1시간마다·창을 닫을 때 자동으로 동기화합니다.");
    if(oldServer)L.push("앱스크립트가 예전 버전입니다. 새 버전으로 바꿔 주세요.");

/* 날짜별 데이터 */
function tasksOf(d){
  return alive(S.tasks).filter(function(t){
    if(t.date>d)return false;
    if(!t.done)return true;
    return t.doneDate===d;
  }).sort(function(a,b){return (a.done-b.done)||a.date.localeCompare(b.date)});
}
function logsOf(d){
  return alive(S.logs).filter(function(x){return x.date===d})
    .sort(function(a,b){return (a.t||"").localeCompare(b.t||"")||(a.updated-b.updated)});
}
function hasAny(d){
  return alive(S.tasks).some(function(t){return t.date===d||t.doneDate===d})||
    alive(S.logs).some(function(x){return x.date===d});
}
function weekOf(d){var g=(dt(d).getDay()+6)%7,a=shift(d,-g),r=[];for(var i=0;i<7;i++)r.push(shift(a,i));return r}

/* 검색 */
function cut(s,q){
  s=str(s).replace(/\s+/g," ");
  var i=s.toLowerCase().indexOf(q.toLowerCase());
  if(i<0||s.length<=90)return s.slice(0,90)+(s.length>90?"…":"");
  var a=Math.max(0,i-30);
  return (a>0?"…":"")+s.slice(a,a+90)+(a+90<s.length?"…":"");
}
function hl(s,q){
  var re=new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  return esc(s).replace(re,function(m){return "<mark>"+m+"</mark>"});
}
function vFind(){

  });

  });
  res.sort(function(a,b){return b.d.localeCompare(a.d)||b.t.localeCompare(a.t)});
  var h='<div class="bar">"'+esc(q)+'" · '+res.length+'건'+(res.length>300?" (최근 300건 표시)":"")+'</div>';
  res.slice(0,300).forEach(function(r){

    h+='<button class="sr" data-k2="'+r.k+'" data-id="'+esc(o.id)+'"><div class="m">'+esc(meta)+'</div>'+

/* ── 내보내기 ── */
function dayTxt(d){
  var t=tasksOf(d),l=logsOf(d);
  var own=t.filter(function(x){return x.date===d||x.doneDate===d});
  if(!own.length&&!l.length)return "";
  var L=["■ "+fd(d)];
  if(t.length){
    L.push("","[할 일]");
    t.forEach(function(x){
      var age=(!x.done&&x.date<d)?" ("+md(x.date)+"부터)":"";
      L.push((x.done?"○ ":"× ")+x.text+age);
    });
  }
  if(l.length){
    L.push("","[기록]");
    l.forEach(function(x){
      var head=(x.t||"--:--")+"  "+(x.kind==="meet"?"[회의] ":"")+(x.label||"");
      L.push("",head.replace(/\s+$/,""));
      L.push(x.text||"(내용 없음)");
    });
  }
  return L.join("\n");
}
function rangeTxt(a,b){
  var out=[],d=a,dn=0,ln=0,mn=0;
  while(d<=b){
    var s=dayTxt(d);
    if(s){out.push(s);
      alive(S.tasks).forEach(function(x){if(x.done&&x.doneDate===d)dn++});
      logsOf(d).forEach(function(x){if(x.kind==="meet")mn++;else ln++});
    }
    d=shift(d,1);
  }
  var un=alive(S.tasks).filter(function(x){return !x.done&&x.date<=b}).length;
  var head=["■■ 업무 기록 "+a+" ~ "+b+" ■■","",
    "완료 "+dn+"건 · 미완 "+un+"건 · 기록 "+ln+"개 · 회의 "+mn+"건",""];
  if(!out.length)return head.join("\n")+"\n(기록 없음)";
  return head.join("\n")+"\n"+out.join("\n\n\n");
}
function period(p){
  var a,b;
  if(p==="day"){a=b=cur}
  else if(p==="week"){var w=weekOf(cur);a=w[0];b=w[6]}
  else if(p==="month"){var d=dt(cur);a=iso(new Date(d.getFullYear(),d.getMonth(),1));
    b=iso(new Date(d.getFullYear(),d.getMonth()+1,0))}
  else{a=$("d1").value;b=$("d2").value;
    if(!a||!b){alert("날짜를 두 개 다 선택해 주세요");return}
    if(a>b){var x=a;a=b;b=x}}
  $("out").value=rangeTxt(a,b);
}
function copyText(s){
  function legacy(){
    var ta=document.createElement("textarea");ta.value=s;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,s.length);
    var c=false;try{c=document.execCommand("copy")}catch(e){}
    ta.remove();return c;
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(s).then(function(){return true},function(){return legacy()});
  }
  return Promise.resolve(legacy());
}
function dl(name,txt,type){
  try{
    var body=(type==="text/plain")?["\uFEFF",txt]:[txt];
    var b=new Blob(body,{type:type+";charset=utf-8"}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
  }catch(e){alert("파일 저장이 막혀 있습니다.")}
}

/* ── 동작 ── */
function addEntry(d,kind){

  S.logs.push(x);save();cur=d;render();

function toTask(el){

function act(a,el){
  var o,box;
  if(a==="addT"){
    S.tasks.push({id:uid(),date:cur,text:"",done:false,doneDate:"",updated:Date.now(),del:false});save();render(true);
    var ta=document.querySelectorAll(".t textarea");if(ta.length)ta[ta.length-1].focus();
  }
  else if(a==="tog"){o=find(S.tasks,el.closest("[data-i]").dataset.i);if(!o)return;
    o.done=!o.done;o.doneDate=o.done?cur:"";o.updated=Date.now();save();render(true)}
  else if(a==="delT"){if(!confirm("이 항목을 지울까요?"))return;
    o=find(S.tasks,el.closest("[data-i]").dataset.i);if(o){o.del=true;o.updated=Date.now()}save();render(true)}
  else if(a==="addL"||a==="addM"){addEntry(el.dataset.day||cur,a==="addM"?"meet":"log")}
  else if(a==="kind"){o=find(S.logs,el.closest("[data-l]").dataset.l);if(!o)return;
    o.kind=o.kind==="meet"?"log":"meet";o.updated=Date.now();save();render(true)}
  else if(a==="delL"){if(!confirm("이 기록을 지울까요?"))return;
    o=find(S.logs,el.closest("[data-l]").dataset.l);if(o){o.del=true;o.updated=Date.now()}save();render(true)}
  else if(a==="toTask"){toTask(el)}
  else if(a==="copyWeek"){var w=weekOf(cur);
    copyText(rangeTxt(w[0],w[6])).then(function(c){toast(c?"이 주 기록을 복사했습니다":"복사가 막혀 있습니다")})}
  else if(a==="copy"){copyText($("out").value).then(function(c){toast(c?"복사했습니다":"복사가 막혀 있습니다")})}
  else if(a==="file"){dl("업무기록_"+cur.slice(5).replace("-","")+".txt",$("out").value,"text/plain")}
  else if(a==="backup"){dl("업무백업_"+today().replace(/-/g,"")+".json",JSON.stringify(S),"application/json")}
  else if(a==="restore"){$("fin").click()}
  else if(a==="saveUrl"){
    var u=$("syncUrl").value.trim();
    if(u&&u.indexOf("https://script.google.com/")!==0){alert("앱스크립트 주소가 아닌 것 같습니다.");return}
    if(u!==SYNC){M={lastSrv:0,lastPush:0,lastSync:0};saveMeta();oldServer=false;lastErr=""}
    SYNC=u;try{localStorage.setItem(SYNKEY,u)}catch(e){}
    status();syncInfo();toast(u?"주소를 저장했습니다":"주소를 지웠습니다");
    if(u)sync(true);
  }
  else if(a==="syncNow"){sync(true);setTimeout(syncInfo,50)}
  else if(a==="close"){closeSheet()}
}

/* 시각 입력: 930 → 09:30, 1430 → 14:30, 9 → 09:00 */
function normT(v){
  v=str(v).replace(/[^\d:]/g,"");
  if(!v)return "";
  var m=v.match(/^(\d{1,2}):?(\d{2})$/);
  if(!m){if(/^\d{1,2}$/.test(v))m=[0,v,"00"];else return null}
  var h=+m[1],mi=+m[2];
  if(h>23||mi>59)return null;
  return p2(h)+":"+p2(mi);
}

  if(t.closest("#findClose")){closeFind();return}

  if(t.id==="q"){vFind();return}
  if(t.tagName==="TEXTAREA"&&t.id!=="out")fit(t);
  var k=t.dataset.k;if(!k||k==="t")return;
  var ti=t.closest("[data-i]"),tl=t.closest("[data-l]");
  var o=ti?find(S.tasks,ti.dataset.i):tl?find(S.logs,tl.dataset.l):null;
  if(o){o[k]=t.value;o.updated=Date.now();save()}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(!t.classList.contains("tm"))return;
  var o=find(S.logs,t.closest("[data-l]").dataset.l);if(!o)return;
  var v=normT(t.value);
  if(v===null){t.value=o.t;toast("시각은 0930 또는 09:30처럼 입력해 주세요");return}
  t.value=v;
  if(v!==o.t){o.t=v;o.updated=Date.now();save();pending=true}
});
document.addEventListener("keydown",function(e){
  var t=e.target;
  if(e.key==="Escape"){if($("sheet").classList.contains("on"))closeSheet();else if(findOn)closeFind();return}
  if(e.key!=="Enter"||e.isComposing)return;
  if(t.classList.contains("ai")){e.preventDefault();toTask(t);return}
  if(t.classList.contains("tm")){e.preventDefault();t.blur();return}
  if(t.classList.contains("lab")){e.preventDefault();var ta=t.closest(".e").querySelector("textarea");if(ta)ta.focus();return}
});
document.addEventListener("focusout",function(){
  setTimeout(function(){if(pending&&!editing()){pending=false;render(true)}},0);
});

/* 기록 화면에서 스크롤하면 위 날짜 띠가 따라감 */
var spyRaf=0;
window.addEventListener("scroll",function(){
  if(tab!=="log"||findOn||spyRaf)return;
  spyRaf=requestAnimationFrame(function(){
    spyRaf=0;
    var line=hh()+16,secs=document.querySelectorAll(".day"),d=null;
    for(var i=0;i<secs.length;i++){if(secs[i].getBoundingClientRect().top<=line)d=secs[i].dataset.day;else break}
    if(!d&&secs[0])d=secs[0].dataset.day;
    if(d&&d!==cur){cur=d;markDay()}
  });
},{passive:true});
window.addEventListener("resize",setHH);

$("fin").addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(String(r.result).replace(/^\uFEFF/,""));
      if(!d||(!d.tasks&&!d.logs&&!d.meets))throw 0;
      /* 백업이 같거나 더 최신이고 내용이 다르면 되살림. 되살린 항목은 지금 시각으로 바꿔 서버에도 반영 */
      var c=cleanAll(d),now=Date.now(),n=0;
      NAMES.forEach(function(nm){
        var idx={};S[nm].forEach(function(o,i){idx[o.id]=i});
        c[nm].forEach(function(b){
          var i=idx[b.id];
          if(i===undefined){b.updated=now;S[nm].push(b);n++;return}
          var loc=S[nm][i];
          if(b.updated<loc.updated||sameItem(nm,loc,b))return;
          b.updated=now;S[nm][i]=b;n++;
        });
      });
      migrate();save();closeSheet();render();
      alert(n?n+"개 항목을 되살렸습니다.":"바뀐 항목이 없습니다.");
      if(n&&SYNC)sync(false);
    }catch(err){alert("읽을 수 없는 파일입니다.")}
  };
  r.readAsText(f);e.target.value="";
});

/* ── 시작 ── */
load();
$("ver").textContent="업무 기록 "+VER;
setTabUI();render();status();
if(tab==="log")scrollToDay(cur);
/* 화면은 기기 데이터로 즉시 띄우고, 동기화는 뒤에서 */
setTimeout(function(){auto(OPEN_GAP)},800);
setInterval(function(){auto(RUN_GAP);status()},60*1000);
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden")push();
  else{status();auto(OPEN_GAP)}
});
window.addEventListener("pagehide",push);
window.addEventListener("online",function(){if(dirtyCount())auto(0)});

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
}
</script>
