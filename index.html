<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>업무 기록</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F4FA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="업무기록">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#F2F4FA;--card:#FFFFFF;--soft:#F5F7FC;--ink:#18203A;--ink2:#3B4460;--mut:#58607A;--faint:#8D95AD;
 --line:#EDF0F6;--seg:#E3E7F2;--ac:#3451D1;--acs:#E6EAFB;--pbg:#FFF3E6;--pchip:#F9D9B4;--pink:#7A3B0A;
 --warn:#8F3D06;--star:#B7791F;--danger:#B42318;
 --sh:0 1px 2px rgba(24,32,58,.04),0 6px 16px rgba(24,32,58,.05);
 --shf:0 2px 4px rgba(24,32,58,.06),0 10px 24px rgba(24,32,58,.10);
 --r:18px;--ease:cubic-bezier(.2,.8,.2,1);--sth:78px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;padding:0;outline:none;border-radius:0}
::placeholder{color:var(--faint);opacity:1}
.wrap{max-width:640px;margin:0 auto}

/* 머리 */
.hdr{padding:calc(14px + env(safe-area-inset-top)) 20px 4px}
.row1{display:flex;align-items:center;gap:8px}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:24px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.sub{margin:2px 0 0;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .err{color:var(--warn);font-weight:700}
.icn{flex:0 0 44px;height:44px;border-radius:22px;background:var(--card);color:var(--ac);display:flex;align-items:center;justify-content:center;transition:transform .15s var(--ease)}
.icn:active{transform:scale(.9)}
.icn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row2{display:flex;align-items:center;gap:8px;margin-top:12px}
.seg{display:inline-flex;gap:2px;background:var(--seg);border-radius:14px;padding:3px}
.seg button{height:36px;padding:0 15px;border-radius:11px;font-size:13px;font-weight:500;color:var(--mut);transition:background .2s var(--ease),color .2s,box-shadow .2s}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(24,32,58,.08)}
.todayb{margin-left:auto;height:40px;padding:0 12px;border-radius:12px;font-size:13px;font-weight:700;color:var(--ac)}
.find{display:flex;gap:6px;align-items:center;margin-top:12px;animation:fadeUp .2s var(--ease)}
.find input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:14px;background:var(--card);font-size:15px;box-shadow:var(--sh)}
.find button{height:44px;padding:0 10px;font-size:14px;font-weight:700;color:var(--ac)}

/* 날짜 띠 */
.strip{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 12px 10px}
.days{display:flex;gap:3px;align-items:center}
.d{flex:1;min-width:0;height:58px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);position:relative;transition:background .22s var(--ease),color .2s}
.d small{font-size:11px;line-height:1.3}
.d b{font-size:15px;font-weight:500;line-height:1.4}
.d.td{color:var(--ac)}
.d.td b{font-weight:700}
.d.on{background:var(--ac);color:#fff}
.d.on b{font-weight:700}
.d i{position:absolute;bottom:6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:2px}
.d.has i{background:#B3BAD0}
.d.on.has i{background:rgba(255,255,255,.85)}
.d.nav{flex:0 0 26px;color:var(--faint);font-size:19px}
.d.nav:active{color:var(--ac)}

/* 본문 */
main{padding:2px 16px calc(124px + env(safe-area-inset-bottom))}
.swap{animation:fadeUp .24s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.wk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);padding:2px 6px 8px;min-height:36px}
.wk .sp{flex:1}
.wk button{height:36px;padding:0 4px;font-size:12.5px;font-weight:700;color:var(--ac)}
.empty{text-align:center;color:var(--mut);font-size:14px;padding:40px 16px;line-height:1.8}
.warn{background:#FFF3E6;color:#5C3A10;border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.lbl{font-size:12px;font-weight:700;color:var(--mut);padding:18px 8px 8px}
.pc{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--pink);background:var(--pchip);border-radius:8px;padding:0 8px;line-height:1.75}
.more{flex:0 0 34px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--faint);border-radius:12px;transition:color .15s,background .15s}
.more:active{background:var(--soft);color:var(--ink2)}

/* 할 일 */
.tl{padding:4px 6px}
.t{display:flex;align-items:flex-start;border-bottom:1px solid var(--line);transition:background .25s}
.t:last-child{border-bottom-color:transparent}
.t.p{background:var(--pbg);border-radius:14px;border-bottom-color:transparent;margin:3px 0}
.ck{flex:0 0 44px;height:50px;display:flex;align-items:center;justify-content:center}
.ck span{width:22px;height:22px;border-radius:11px;border:1.6px solid var(--faint);display:flex;align-items:center;justify-content:center;transition:background .2s var(--ease),border-color .2s,transform .22s var(--ease)}
.t.p .ck span{border-color:#B98B5E}
.ck svg{opacity:0;transform:scale(.4);transition:opacity .15s,transform .22s var(--ease)}
.t.dn .ck span,.t.checking .ck span{background:var(--ac);border-color:var(--ac)}
.t.dn .ck svg,.t.checking .ck svg{opacity:1;transform:none}
.t.checking .ck span{transform:scale(1.15)}
.tb{flex:1;min-width:0;padding:13px 0 12px}
.tb textarea{display:block;width:100%;resize:none;overflow:hidden;font-size:15px;line-height:1.5;min-height:22px}
.t.dn textarea,.t.checking textarea{color:var(--mut);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;font-size:12px;font-weight:700}
.old{color:var(--warn)}
.calb{display:inline-flex;align-items:center;gap:4px;color:var(--ac)}
.calb.wait{color:var(--mut);font-weight:500}
.star{flex:0 0 40px;height:50px;display:flex;align-items:center;justify-content:center;color:var(--faint);transition:transform .22s var(--ease),color .2s}
.star svg{fill:none}
.star.on{color:var(--star)}
.star.on svg{fill:currentColor}
.star:active{transform:scale(.8)}
.t .more{height:50px}
.donec{background:#E8EBF3;box-shadow:none}

/* 기록 */
.pins{padding:6px;margin-bottom:6px}
.ph{display:flex;align-items:center;gap:6px;padding:7px 12px 3px;color:var(--mut);font-size:12px;font-weight:700}
.pr{display:flex;align-items:center;gap:8px;width:100%;text-align:left;min-height:42px;padding:0 12px;border-radius:12px;font-size:14.5px;font-weight:500;transition:background .15s}
.pr span:first-child{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr:active{background:var(--soft)}
.pmore{display:block;width:100%;text-align:left;height:38px;padding:0 12px;font-size:13px;font-weight:700;color:var(--ac);border-radius:12px}
.pins .e{box-shadow:none;background:var(--soft);margin:4px 0;animation:fadeUp .2s var(--ease)}
.pins .e.p{background:var(--pbg)}
.day{padding-bottom:4px}
.dh{position:sticky;top:var(--sth);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 4px 8px}
.dh .dd{font-size:17px;font-weight:700}
.dh .dw{font-size:13px;color:var(--mut)}
.dh .sp{flex:1}
.tg{font-size:11px;font-weight:700;color:var(--ac);background:var(--acs);border-radius:8px;padding:0 8px;line-height:1.75}
.add{height:40px;padding:0 6px;font-size:13px;font-weight:700;color:var(--ac);border-radius:10px}
.add:active{background:var(--acs)}
.day.none .dh{padding-top:4px;padding-bottom:2px}
.day.none .dd{font-size:14px;font-weight:600;color:var(--faint)}
.day.none .dw{color:var(--faint)}
.day.none .add{color:var(--faint)}
.es{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.e{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:10px 6px 12px 16px;transition:background .25s}
.e.p{background:var(--pbg);box-shadow:none}
.eh{display:flex;align-items:center;gap:8px;min-height:40px}
.tm{flex:0 0 44px;width:44px;font-size:12.5px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.kb{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--ac);background:var(--acs);border-radius:8px;padding:0 8px;line-height:1.75}
.lab{flex:1;min-width:0;font-size:15px;font-weight:700}
.e .more{height:40px}
.e textarea{display:block;width:100%;resize:none;overflow:hidden;font-size:14.5px;line-height:1.6;color:var(--ink2);padding-right:10px;min-height:23px}
.fold{flex:0 0 auto;height:40px;padding:0 6px;font-size:12.5px;font-weight:700;color:var(--ac)}
.act{display:flex;gap:6px;margin:10px 10px 0 0}
.act input{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:12px;background:var(--soft);font-size:14px}
.e.p .act input{background:rgba(255,255,255,.75)}
.act button{flex:0 0 auto;height:40px;padding:0 12px;border-radius:12px;background:var(--acs);color:var(--ac);font-size:13px;font-weight:700}
.tail{height:42vh}

/* 검색 */
.bar{font-size:12.5px;color:var(--mut);padding:2px 6px 10px}
.sr{display:block;width:100%;text-align:left;background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:12px 16px;margin-bottom:8px;transition:transform .15s var(--ease)}
.sr:active{transform:scale(.98)}
.sr .m{font-size:12px;color:var(--mut)}
.sr .s{font-size:14.5px;word-break:break-all}
.sr .s.b{font-weight:700}
mark{background:#FDE7B0;color:inherit;border-radius:3px;padding:0 1px}

/* 움직임 */
.hl{animation:hl 1s ease}
@keyframes hl{0%{box-shadow:0 0 0 3px rgba(52,81,209,.32)}100%{box-shadow:0 0 0 3px rgba(52,81,209,0)}}
.e.hl{animation:hle 1s ease}
@keyframes hle{0%{box-shadow:0 0 0 3px rgba(52,81,209,.32),var(--sh)}100%{box-shadow:0 0 0 3px rgba(52,81,209,0),var(--sh)}}
.leave{opacity:0;transform:translateX(-12px);height:0!important;min-height:0!important;padding-top:0!important;padding-bottom:0!important;
 margin-top:0!important;margin-bottom:0!important;border-width:0!important;overflow:hidden;
 transition:height .24s var(--ease),opacity .16s,transform .2s,padding .24s,margin .24s}

/* 아래 탭 */
.dock{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;padding:0 20px;pointer-events:none;transition:transform .28s var(--ease),opacity .2s}
.dock .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px}
body.typing .dock{transform:translateY(130%);opacity:0}
nav{flex:1;display:flex;gap:4px;background:var(--card);border-radius:30px;padding:6px;box-shadow:var(--shf);pointer-events:auto}
nav button{flex:1;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;color:var(--mut);transition:background .28s var(--ease),color .2s}
nav button.on{background:var(--ac);color:#fff;font-weight:700}
.fab{flex:0 0 60px;height:60px;border-radius:30px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:auto;
 box-shadow:0 2px 4px rgba(24,32,58,.10),0 10px 24px rgba(52,81,209,.30);transition:transform .18s var(--ease)}
.fab:active{transform:scale(.9)}

/* 메뉴 */
.menu{position:fixed;top:0;left:0;z-index:40;min-width:184px;background:var(--card);border-radius:14px;padding:6px;
 box-shadow:0 4px 8px rgba(24,32,58,.08),0 16px 40px rgba(24,32,58,.16);opacity:0;transform:scale(.95);
 transform-origin:top right;pointer-events:none;transition:opacity .14s,transform .18s var(--ease)}
.menu.on{opacity:1;transform:none;pointer-events:auto}
.menu button{display:block;width:100%;text-align:left;height:44px;padding:0 14px;border-radius:10px;font-size:14.5px}
.menu button:active{background:var(--soft)}
.menu .dg{color:var(--danger)}

/* 내보내기 시트 */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(24,32,58,0);visibility:hidden;transition:background .25s,visibility 0s .3s}
.sheet.on{background:rgba(24,32,58,.32);visibility:visible;transition:background .25s}
.sheet .in{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;
 padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;transform:translateY(100%);transition:transform .32s var(--ease)}
.sheet.on .in{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:#D5DAE6;margin:0 auto 12px}
.sheet h2{margin:0 0 12px;font-size:18px}
.lb{font-size:12.5px;font-weight:700;color:var(--mut);margin:18px 0 6px}
.row{display:flex;gap:8px;align-items:center}
.btn{flex:1;height:44px;border-radius:12px;background:var(--soft);font-size:14px;font-weight:600;color:var(--ink2);transition:transform .15s var(--ease),background .2s,color .2s}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--acs);color:var(--ac)}
.btn.pri{background:var(--ac);color:#fff}
.tilde{color:var(--mut)}
.sheet input[type=date],.sheet input[type=text]{flex:1;min-width:0;height:44px;padding:0 12px;border-radius:12px;background:var(--soft);font-size:14px}
#syncUrl{width:100%}
#out{width:100%;height:220px;margin-top:12px;padding:12px;border-radius:12px;background:var(--soft);font-size:13px;line-height:1.6;white-space:pre;overflow:auto;resize:vertical}
.info{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.7}
.info.err{color:var(--warn)}
.ver{font-size:11.5px;color:var(--faint);text-align:center;margin-top:18px}

/* 알림 */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:4px;
 max-width:calc(100% - 40px);min-height:46px;padding:0 6px 0 16px;border-radius:14px;background:#1F2740;color:#fff;font-size:14px;
 box-shadow:0 10px 24px rgba(24,32,58,.25);opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity .2s,transform .28s var(--ease)}
.toast.noact{padding-right:16px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{padding:12px 8px 12px 0}
.toast button{flex:0 0 auto;height:38px;padding:0 12px;border-radius:10px;color:#AFC0FF;font-weight:700}
body.typing .toast{bottom:calc(16px + env(safe-area-inset-bottom))}

/* 넓은 화면: 고정 메모를 왼쪽에 항상 표시 */
#side{display:none}
.pe{margin:0;padding:6px 12px 10px;font-size:13px;color:var(--mut);line-height:1.7}
@media (min-width:1000px){
  .wrap,.dock .in{position:relative;left:152px}
  .toast{left:calc(50% + 152px)}
  #side{display:block;position:fixed;z-index:25;top:24px;left:calc(50% - 472px);width:280px;max-height:calc(100vh - 48px);overflow:auto;padding:2px 2px 12px}
  #side .pins{margin:0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="hdr"><div class="wrap">
  <div class="row1">
    <div class="ttl"><h1 id="ttl">할 일</h1><p class="sub" id="sub"></p></div>
    <button class="icn" id="findBtn" aria-label="검색"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="icn" id="syncBtn" aria-label="동기화"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
    <button class="icn" id="expBtn" aria-label="내보내기와 설정"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 14v5h14v-5"/></svg></button>
  </div>
  <div class="row2" id="row2">
    <div class="seg" role="group" aria-label="분류">
      <button data-f="all">전체</button><button data-f="w">업무</button><button data-f="p">개인</button>
    </div>
    <button class="todayb" id="todayBtn">오늘</button>
  </div>
  <div class="find" id="find" hidden>
    <input type="search" id="q" placeholder="기록 · 회의 · 할 일 검색" autocomplete="off" aria-label="검색어">
    <button id="findClose">닫기</button>
  </div>
</div></header>

<div class="strip" id="strip"><div class="wrap days" id="days"></div></div>

<main class="wrap" id="view"></main>

<aside id="side" aria-label="고정 메모"></aside>

<div class="dock"><div class="in">
  <nav id="nav" aria-label="탭">
    <button data-t="task"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>할 일</button>
    <button data-t="log"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h9l4 4v12H6z"/><path d="M9 12h7M9 16h5"/></svg>기록</button>
  </nav>
  <button class="fab" id="fab" aria-label="추가"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</div></div>

<div class="menu" id="menu" role="menu"></div>

<div class="sheet" id="sheet"><div class="in" role="dialog" aria-label="내보내기와 설정">
  <div class="grab"></div>
  <h2>내보내기</h2>
  <div class="row">
    <button class="btn" data-p="day">선택한 날</button>
    <button class="btn" data-p="week">그 주</button>
    <button class="btn" data-p="month">그 달</button>
  </div>
  <div class="row" style="margin-top:8px">
    <input type="date" id="d1" aria-label="시작 날짜"><span class="tilde">~</span><input type="date" id="d2" aria-label="끝 날짜">
    <button class="btn" data-p="range" style="flex:0 0 64px">조회</button>
  </div>
  <div class="lb">포함할 분류</div>
  <div class="seg" role="group" aria-label="포함할 분류"><button data-xc="w">업무만</button><button data-xc="all">전체</button><button data-xc="p">개인만</button></div>
  <textarea id="out" spellcheck="false" aria-label="내보내기 내용"></textarea>
  <div class="row" style="margin-top:8px">
    <button class="btn pri" data-a="copy">복사</button>
    <button class="btn" data-a="file">파일 저장</button>
  </div>

  <div class="lb">동기화 주소 · 이 기기에만 저장됩니다</div>

<div class="toast noact" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script>
"use strict";
var VER="v9.1";
var KEY="work-log-v1",MKEY="work-log-meta",SYNKEY="worklog-sync-url",TABKEY="worklog-tab",FKEY="worklog-filter",XKEY="worklog-expcat";
var NAMES=["tasks","logs","meets"],DOW=["일","월","화","수","목","금","토"];
var OPEN_GAP=10*60*1000;   /* 열거나 돌아왔을 때: 마지막 동기화가 10분 넘었으면 */
var RUN_GAP=60*60*1000;    /* 열어 두는 동안: 1시간마다 */
var EDIT_GAP=30*1000;      /* 고친 뒤 30초 동안 손을 안 대면 */
var TIME_RE=/^\s*(\d{1,2}):(\d{2})\s+\S/;
var RM=false,COARSE=false;
try{RM=window.matchMedia("(prefers-reduced-motion: reduce)").matches;COARSE=window.matchMedia("(pointer: coarse)").matches}catch(e){}
var S,M,cur,tab="task",filt="all",expCat="w",lastP="day",SYNC="",SUM="";
var ok=true,syncing=false,lastErr="",calErr="",oldServer=false,pending=false,findOn=false,pinAll=false,openPin=null,schT=0,menuFor=null,menuY=0;
var WQ=null,WIDE=false;
try{WQ=window.matchMedia("(min-width: 1000px)");WIDE=WQ.matches;
  var onW=function(){WIDE=WQ.matches;render(true)};
  if(WQ.addEventListener)WQ.addEventListener("change",onW);else WQ.addListener(onW)}catch(e){}
try{
  SYNC=localStorage.getItem(SYNKEY)||"";
  tab=localStorage.getItem(TABKEY)==="log"?"log":"task";
  var f0=localStorage.getItem(FKEY);if(f0==="w"||f0==="p")filt=f0;
  var x0=localStorage.getItem(XKEY);if(x0==="all"||x0==="p")expCat=x0;
}catch(e){}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

var I_PIN='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3z"/><path d="M12 13v7"/></svg>';
var I_STAR='<svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg>';
var I_MORE='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>';
var I_CHECK='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var I_CAL='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>';

function $(id){return document.getElementById(id)}
function p2(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function dt(s){return new Date(s+"T00:00:00")}
function shift(s,n){var d=dt(s);d.setDate(d.getDate()+n);return iso(d)}
function md(s){var d=dt(s);return (d.getMonth()+1)+"/"+d.getDate()}
function fd(s){return s+" ("+DOW[dt(s).getDay()]+")"}
function longDate(s){var d=dt(s);return (d.getMonth()+1)+"월 "+d.getDate()+"일 "+DOW[d.getDay()]+"요일"+(s===today()?" · 오늘":"")}
function hm(){var t=new Date();return p2(t.getHours())+":"+p2(t.getMinutes())}
function uid(){return Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function today(){return iso(new Date())}
function diff(a,b){return Math.round((dt(b)-dt(a))/86400000)}
function str(v){return v==null?"":String(v)}
function B(v){return v===true||v==="TRUE"||v==="true"}
function find(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}
function alive(a){return a.filter(function(x){return !x.del})}
function timeOf(s){var m=TIME_RE.exec(s||"");return !!(m&&+m[1]<24&&+m[2]<60)}
function catOK(o,f){return f==="all"||((f==="p")===(o.cat==="p"))}

/* ── 데이터 정리 ── */
function toDate_(v){
  var s=str(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  var d=new Date(s);
  return isNaN(d)?s:iso(d);
}
function toTime_(v){
  var s=str(v);
  if(!s)return "";
  if(/^\d{1,2}:\d{2}$/.test(s))return s.length===4?"0"+s:s;
  var d=new Date(s);
  if(isNaN(d))return s;
  return p2(d.getHours())+":"+p2(d.getMinutes());
}
var DEF={
  tasks:{date:"",text:"",done:false,doneDate:"",star:false,cat:"",updated:0,del:false},
  logs:{date:"",t:"",label:"",text:"",kind:"log",pin:false,cat:"",updated:0,del:false},
  meets:{date:"",title:"",body:"",updated:0,del:false}
};
/* 들어온 칸만 정리 — 없는 칸은 건드리지 않음 */
function normOne(n,x){
  var o={id:String(x.id)},h=function(k){return Object.prototype.hasOwnProperty.call(x,k)};
  if(h("date"))o.date=toDate_(x.date);
  if(h("updated"))o.updated=Number(x.updated)||0;
  if(h("del"))o.del=B(x.del);
  if(n==="tasks"){
    if(h("text"))o.text=str(x.text);
    if(h("done"))o.done=B(x.done);
    if(h("doneDate"))o.doneDate=x.doneDate?toDate_(x.doneDate):"";
    if(h("star"))o.star=B(x.star);
    if(h("cat"))o.cat=x.cat==="p"?"p":"";
    if(h("calId"))o.calId=str(x.calId);
  }else if(n==="logs"){
    if(h("t"))o.t=toTime_(x.t);
    if(h("label"))o.label=str(x.label);
    if(h("text"))o.text=str(x.text);
    if(h("kind"))o.kind=x.kind==="meet"?"meet":"log";
    if(h("pin"))o.pin=B(x.pin);
    if(h("cat"))o.cat=x.cat==="p"?"p":"";
  }else{
    if(h("title"))o.title=str(x.title);
    if(h("body"))o.body=str(x.body);
  }
  return o;
}
function fill(n,o){var d=DEF[n];for(var k in d)if(!(k in o))o[k]=d[k];return o}
function cleanAll(data){
  var r={tasks:[],logs:[],meets:[]};
  NAMES.forEach(function(n){(data&&data[n]||[]).forEach(function(x){if(x&&x.id)r[n].push(fill(n,normOne(n,x)))})});
  return r;
}
function sameItem(n,a,b){for(var k in DEF[n])if(k!=="updated"&&a[k]!==b[k])return false;return true}

/* 예전 회의 탭 항목을 기록(회의)으로 옮김. id를 고정해서 기기마다 옮겨도 중복되지 않음 */
function migrate(){
  var ch=false,now=Date.now(),ids={};
  S.logs.forEach(function(l){ids[l.id]=1});
  S.meets.forEach(function(m){
    if(m.del)return;
    var id="m"+m.id;
    if(!ids[id]){S.logs.push({id:id,date:m.date,t:"",label:m.title||"",text:m.body||"",kind:"meet",pin:false,cat:"",updated:now,del:false});ids[id]=1}
    m.del=true;m.updated=now;ch=true;
  });
  return ch;
}

/* ── 저장 ── */
function load(){
  try{
    var r=localStorage.getItem(KEY);
    S=cleanAll(r?JSON.parse(r):{});
    localStorage.setItem(KEY+"_t","1");localStorage.removeItem(KEY+"_t");
  }catch(e){ok=false;S={tasks:[],logs:[],meets:[]}}
  try{M=JSON.parse(localStorage.getItem(MKEY)||"{}")||{}}catch(e){M={}}
  M.lastSrv=Number(M.lastSrv)||0;M.lastPush=Number(M.lastPush)||0;M.lastSync=Number(M.lastSync)||0;
  if(migrate())store();
  cur=today();
}
function store(){if(!ok)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){ok=false}}
function saveMeta(){lsSet(MKEY,JSON.stringify(M))}
function save(){store();status();schedule()}

/* ── 동기화 ── */
function dirtyOf(n){return S[n].filter(function(o){return (o.updated||0)>M.lastPush})}
function dirtyCount(){return dirtyOf("tasks").length+dirtyOf("logs").length+dirtyOf("meets").length}
function payload(){var p={v:VER,since:M.lastSrv};NAMES.forEach(function(n){p[n]=dirtyOf(n)});return p}

/* 서버에서 받은 것을 기기 데이터와 병합 — 통째로 바꾸지 않으므로 입력 중인 내용이 지워지지 않음 */
function mergeIn(data){
  var ch=false;
  NAMES.forEach(function(n){
    var idx={};S[n].forEach(function(o,i){idx[o.id]=i});
    (data&&data[n]||[]).forEach(function(x){
      if(!x||!x.id)return;
      var inc=normOne(n,x),i=idx[inc.id];
      if(i===undefined){S[n].push(fill(n,inc));idx[inc.id]=S[n].length-1;ch=true;return}
      var loc=S[n][i];
      if((inc.updated||0)<=(loc.updated||0)){
        /* 캘린더 일정 id는 서버만 정하므로 따로 받음 */
        if("calId" in inc&&inc.calId!==(loc.calId||"")){loc.calId=inc.calId;ch=true}
        return;
      }
      var nw=fill(n,Object.assign({},loc,inc));
      if(!sameItem(n,nw,loc)||nw.updated!==loc.updated||nw.calId!==loc.calId){S[n][i]=nw;ch=true}
    });
  });
  if(migrate())ch=true;
  return ch;
}

function sync(loud){
  if(!SYNC){if(loud)alert("먼저 내보내기 화면에서 동기화 주소를 저장해 주세요.");return}
  if(syncing)return;
  clearTimeout(schT);
  syncing=true;lastErr="";status();
  var start=Date.now(),body=JSON.stringify(payload());
  fetch(SYNC,{method:"POST",body:body})
    .then(function(r){return r.json()})
    .then(function(j){
      if(!j||!j.ok)throw new Error(j&&j.error?j.error:"응답 오류");
      oldServer=!("now" in j);
      calErr=j.cal||"";
      var ch=mergeIn(j.data||{});
      if(!oldServer)M.lastSrv=Number(j.now)||M.lastSrv;
      M.lastPush=start;M.lastSync=Date.now();saveMeta();store();
      syncing=false;status();
      if($("sheet").classList.contains("on"))syncInfo();
      if(ch)refresh();
      if(dirtyCount())schedule();
      if(loud){
        if(oldServer)alert("동기화는 됐지만 앱스크립트가 예전 버전입니다.\n새 앱스크립트로 바꿔야 고정·분류·캘린더가 시트에 저장됩니다.");
        else if(calErr)alert("동기화는 됐지만 캘린더 등록에 실패했습니다.\n앱스크립트에서 authorize를 한 번 실행해 권한을 허용해 주세요.\n\n"+calErr);
        else toast("동기화했습니다");
      }
    })
    .catch(function(err){
      syncing=false;lastErr=String(err&&err.message||err);status();
      if($("sheet").classList.contains("on"))syncInfo();
      if(loud)alert("동기화에 실패했습니다.\n주소가 맞는지, 인터넷이 되는지 확인해 주세요.\n\n"+lastErr);
    });
}
/* 고치고 30초 동안 손을 안 대면 동기화 */
function schedule(){
  if(!SYNC)return;
  clearTimeout(schT);
  schT=setTimeout(function(){
    if(document.visibilityState==="visible"&&navigator.onLine!==false&&dirtyCount())sync(false);
  },EDIT_GAP);
}
/* 창을 닫을 때 바뀐 것만 조용히 올림 */
function push(){
  if(!SYNC||syncing||!dirtyCount())return;
  var body=JSON.stringify(payload());
  if(body.length>60000)return;   /* 전송 한도를 넘으면 다음 동기화 때 보냄 */
  try{if(navigator.sendBeacon&&navigator.sendBeacon(SYNC,body))return}catch(e){}
  try{fetch(SYNC,{method:"POST",body:body,keepalive:true,mode:"no-cors"}).catch(function(){})}catch(e){}
}
function auto(gap){
  if(!SYNC||syncing||document.visibilityState!=="visible")return;
  if(navigator.onLine===false)return;
  if(!S.tasks.length&&!S.logs.length){sync(false);return}   /* 기기가 비어 있으면 서버에서 복구 */
  if(Date.now()-M.lastSync>gap)sync(false);
}

function ago(ms){
  var m=Math.round((Date.now()-ms)/60000);
  if(m<1)return "방금";if(m<60)return m+"분 전";
  var h=Math.floor(m/60);if(h<24)return h+"시간 전";
  var d=new Date(ms);return (d.getMonth()+1)+"/"+d.getDate();
}
function stamp(ms){var d=new Date(ms);return (d.getMonth()+1)+"/"+d.getDate()+" "+p2(d.getHours())+":"+p2(d.getMinutes())}
function status(){
  var c=false,t;
  if(!ok){t="자동 저장이 막혀 있음";c=true}
  else if(!SYNC)t="동기화 주소 없음";
  else if(syncing)t="동기화 중";
  else if(oldServer){t="앱스크립트 업데이트 필요";c=true}
  else if(lastErr){t="동기화 실패 · 미전송 "+dirtyCount();c=true}
  else if(calErr){t="캘린더 등록 실패";c=true}
  else t=M.lastSync?"동기화 "+ago(M.lastSync):"동기화 전";
  $("sub").innerHTML=(SUM?esc(SUM)+" · ":"")+'<span'+(c?' class="err"':'')+'>'+esc(t)+'</span>';
  $("syncBtn").classList.toggle("spin",syncing);
}
function syncInfo(){
  var el=$("syncInfo"),n=dirtyCount(),L=[];
  if(!SYNC)L.push("주소를 저장하면 자동으로 동기화합니다.");
  else{
    L.push("마지막 동기화 "+(M.lastSync?stamp(M.lastSync):"없음")+" · 보내지 않은 변경 "+n+"건");
    L.push("고친 뒤 30초, 앱을 열 때, 1시간마다, 창을 닫을 때 자동으로 동기화합니다.");
    L.push("\"14:00 차장님 보고\"처럼 시:분으로 시작하는 할 일은 구글 캘린더에 등록됩니다.");
    if(oldServer)L.push("앱스크립트가 예전 버전입니다. 새 버전으로 바꿔 주세요.");
    if(lastErr)L.push("최근 오류: "+lastErr);
    if(calErr)L.push("캘린더 오류: "+calErr);
  }
  el.innerHTML=L.map(esc).join("<br>");
  el.classList.toggle("err",!!(oldServer||lastErr||calErr));
}

/* ── 화면 도우미 ── */
function stripH(){return $("strip").offsetHeight}
function setSTH(){document.documentElement.style.setProperty("--sth",stripH()+"px")}
function goY(y,smooth){try{window.scrollTo({top:Math.max(0,y),behavior:(smooth&&!RM)?"smooth":"auto"})}catch(e){window.scrollTo(0,Math.max(0,y))}}
function fit(e){e.style.height="auto";e.style.height=(e.scrollHeight+1)+"px"}
function fitAll(){document.querySelectorAll("#view textarea").forEach(fit)}
function inArea(el){return $("view").contains(el)||$("side").contains(el)}
function editing(){
  var a=document.activeElement;
  return !!(a&&a!==document.body&&inArea(a)&&/^(INPUT|TEXTAREA)$/.test(a.tagName));
}
/* 입력 중이면 끝난 뒤에 다시 그림 (커서가 튀지 않게) */
function refresh(){if(editing()){pending=true;return}render(true)}
function hl(el){if(!el||RM)return;el.classList.remove("hl");void el.offsetWidth;el.classList.add("hl")}
function collapse(el,cb){
  if(!el||RM){cb();return}
  el.style.height=el.offsetHeight+"px";void el.offsetHeight;el.classList.add("leave");
  setTimeout(cb,230);
}
var toastT=0,toastFn=null;
function toast(m,act,fn){
  var t=$("toast"),b=$("toastAct");
  $("toastMsg").textContent=m;
  if(act){b.textContent=act;b.hidden=false;toastFn=fn}else{b.hidden=true;toastFn=null}
  t.classList.toggle("noact",!act);t.classList.add("on");
  clearTimeout(toastT);
  toastT=setTimeout(function(){t.classList.remove("on");toastFn=null},act?5000:1800);
}

/* ── 날짜별 데이터 ── */
function posMap(arr){var p={};arr.forEach(function(o,i){p[o.id]=i});return p}
/* 미완 → 완료. 그 안에서 별 → 최근 날짜 → 최근에 만든 것 */
function tasksOf(d,f){
  var pos=posMap(S.tasks);
  return alive(S.tasks).filter(function(t){
    if(!catOK(t,f)||t.date>d)return false;
    return !t.done||t.doneDate===d;
  }).sort(function(a,b){
    return ((a.done?1:0)-(b.done?1:0))||((b.star?1:0)-(a.star?1:0))||b.date.localeCompare(a.date)||(pos[b.id]-pos[a.id]);
  });
}
function logsOf(d,f){
  return alive(S.logs).filter(function(x){return x.date===d&&!x.pin&&catOK(x,f)})
    .sort(function(a,b){return (a.t||"").localeCompare(b.t||"")||(a.updated-b.updated)});
}
function pinsOf(f){return alive(S.logs).filter(function(x){return x.pin&&catOK(x,f)})}
function hasAny(d){
  return alive(S.tasks).some(function(t){return catOK(t,filt)&&(t.date===d||t.doneDate===d)})||
    alive(S.logs).some(function(x){return x.date===d&&!x.pin&&catOK(x,filt)});
}
function weekOf(d){var g=(dt(d).getDay()+6)%7,a=shift(d,-g),r=[];for(var i=0;i<7;i++)r.push(shift(a,i));return r}

function strip(){
  var td=today(),h='<button class="d nav" data-shift="-7" aria-label="이전 주">‹</button>';
  weekOf(cur).forEach(function(d){
    h+='<button class="d'+(d===cur?" on":"")+(hasAny(d)?" has":"")+(d===td?" td":"")+'" data-d="'+d+'" aria-label="'+md(d)+" "+DOW[dt(d).getDay()]+'요일"><small>'+
      DOW[dt(d).getDay()]+'</small><b>'+dt(d).getDate()+'</b><i></i></button>';
  });
  h+='<button class="d nav" data-shift="7" aria-label="다음 주">›</button>';
  $("days").innerHTML=h;
}
function markDay(){document.querySelectorAll(".d[data-d]").forEach(function(b){b.classList.toggle("on",b.dataset.d===cur)})}
function markSeg(){document.querySelectorAll("[data-f]").forEach(function(b){var on=b.dataset.f===filt;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)})}

/* ── 할 일 ── */
function taskRow(t){
  var age=(!t.done&&t.date<cur)?diff(t.date,cur)+1:0,meta="";
  if(age)meta+='<span class="old">'+age+'일째</span>';
  if(timeOf(t.text))meta+=t.calId?'<span class="calb">'+I_CAL+'캘린더 등록됨</span>':'<span class="calb wait">'+I_CAL+'동기화하면 캘린더에 등록</span>';
  if(t.cat==="p")meta+='<span class="pc">개인</span>';

function cut(s,q){

  var i=s.toLowerCase().indexOf(q.toLowerCase());
  if(i<0||s.length<=90)return s.slice(0,90)+(s.length>90?"…":"");
  var a=Math.max(0,i-30);
  return (a>0?"…":"")+s.slice(a,a+90)+(a+90<s.length?"…":"");
}
function hlq(s,q){
  var re=new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  return esc(s).replace(re,function(m){return "<mark>"+m+"</mark>"});
}

/* ── 내보내기 ── */
function dayTxt(d,f){
  var t=tasksOf(d,f),l=logsOf(d,f);
  var own=t.filter(function(x){return x.date===d||x.doneDate===d});
  if(!own.length&&!l.length)return "";
  var L=["■ "+fd(d)];
  if(t.length){
    L.push("","[할 일]");
    t.forEach(function(x){
      var age=(!x.done&&x.date<d)?" ("+md(x.date)+"부터)":"";
      L.push((x.done?"○ ":"× ")+(f!=="w"&&x.cat==="p"?"[개인] ":"")+x.text+(x.star&&!x.done?" [중요]":"")+age);
    });
  }
  if(l.length){
    L.push("","[기록]");
    l.forEach(function(x){
      var head=(x.t||"--:--")+"  "+(x.kind==="meet"?"[회의] ":"")+(f!=="w"&&x.cat==="p"?"[개인] ":"")+(x.label||"");
      L.push("",head.replace(/\s+$/,""));
      L.push(x.text||"(내용 없음)");
    });
  }
  return L.join("\n");
}
function rangeTxt(a,b,f){
  var out=[],d=a,dn=0,ln=0,mn=0;
  while(d<=b){
    var s=dayTxt(d,f);
    if(s){out.push(s);
      alive(S.tasks).forEach(function(x){if(x.done&&x.doneDate===d&&catOK(x,f))dn++});
      logsOf(d,f).forEach(function(x){if(x.kind==="meet")mn++;else ln++});
    }
    d=shift(d,1);
  }
  var un=alive(S.tasks).filter(function(x){return !x.done&&x.date<=b&&catOK(x,f)}).length;
  var head=["■■ 업무 기록 "+a+" ~ "+b+(f==="all"?" (개인 포함)":f==="p"?" (개인)":"")+" ■■","",
    "완료 "+dn+"건 · 미완 "+un+"건 · 기록 "+ln+"개 · 회의 "+mn+"건",""];
  if(!out.length)return head.join("\n")+"\n(기록 없음)";
  return head.join("\n")+"\n"+out.join("\n\n\n");
}
function period(p){
  var a,b;
  if(p==="day"){a=b=cur}
  else if(p==="week"){var w=weekOf(cur);a=w[0];b=w[6]}

    b=iso(new Date(d.getFullYear(),d.getMonth()+1,0))}
  else{a=$("d1").value;b=$("d2").value;
    if(!a||!b){alert("날짜를 두 개 다 선택해 주세요");return}
    if(a>b){var x=a;a=b;b=x}}
  lastP=p;markExp();
  $("out").value=rangeTxt(a,b,expCat);
}

function copyText(s){
  function legacy(){
    var ta=document.createElement("textarea");ta.value=s;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,s.length);
    var c=false;try{c=document.execCommand("copy")}catch(e){}
    ta.remove();return c;
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(s).then(function(){return true},function(){return legacy()});
  }
  return Promise.resolve(legacy());
}

/* 시각 입력: 930 → 09:30, 1430 → 14:30, 9 → 09:00 */
function normT(v){
  v=str(v).replace(/[^\d:]/g,"");
  if(!v)return "";
  var m=v.match(/^(\d{1,2}):?(\d{2})$/);
  if(!m){if(/^\d{1,2}$/.test(v))m=[0,v,"00"];else return null}
  var h=+m[1],mi=+m[2];
  if(h>23||mi>59)return null;
  return p2(h)+":"+p2(mi);
}

  }
  if(a==="star"){
    row=el.closest("[data-i]");o=find(S.tasks,row.dataset.i);if(!o)return;
    o.star=!o.star;o.updated=Date.now();save();render(true);
    hl(document.querySelector('[data-i="'+o.id+'"]'));
    return;
  }
  if(a==="addL"||a==="addM"){addEntry(el.dataset.day||cur,a==="addM"?"meet":"log");return}
  if(a==="openPin"){openPin=el.dataset.id;render(true);return}
  if(a==="closePin"){openPin=null;render(true);return}
  if(a==="pinAll"){pinAll=!pinAll;render(true);return}
  if(a==="toTask"){toTask(el);return}
  if(a==="copyWeek"){
    var w=weekOf(cur);
    copyText(rangeTxt(w[0],w[6],"w")).then(function(c){toast(c?"이 주 업무 기록을 복사했습니다":"복사가 막혀 있습니다")});
    return;
  }
  if(a==="copy"){copyText($("out").value).then(function(c){toast(c?"복사했습니다":"복사가 막혀 있습니다")});return}
  if(a==="file"){dl("업무기록_"+cur.slice(5).replace("-","")+".txt",$("out").value,"text/plain");return}
  if(a==="backup"){dl("업무백업_"+today().replace(/-/g,"")+".json",JSON.stringify(S),"application/json");return}
  if(a==="restore"){$("fin").click();return}
  if(a==="saveUrl"){
    var u=$("syncUrl").value.trim();
    if(u&&u.indexOf("https://script.google.com/")!==0){alert("앱스크립트 주소가 아닌 것 같습니다.");return}
    if(u!==SYNC){M={lastSrv:0,lastPush:0,lastSync:0};saveMeta();oldServer=false;lastErr="";calErr=""}
    SYNC=u;lsSet(SYNKEY,u);
    status();syncInfo();toast(u?"주소를 저장했습니다":"주소를 지웠습니다");
    if(u)sync(true);
    return;
  }
  if(a==="syncNow"){sync(true);syncInfo();return}
  if(a==="close"){closeSheet();return}
}

document.addEventListener("click",function(e){
  var t=e.target,el;
  if(menuFor&&!t.closest("#menu")&&!t.closest('[data-a="menu"]')){closeMenu();return}
  if((el=t.closest("[data-ma]"))){menuAct(el.dataset.ma);return}
  if(t===$("sheet")){closeSheet();return}
  if(t.closest("#toastAct")){var fn=toastFn;toastFn=null;$("toast").classList.remove("on");if(fn)fn();return}
  if((el=t.closest("[data-shift]"))){cur=shift(cur,+el.dataset.shift);render(false,true);
    if(tab==="log")scrollToDay(cur);else window.scrollTo(0,0);return}
  if((el=t.closest(".d[data-d]"))){
    var d=el.dataset.d;
    if(tab==="log"&&!findOn){
      var has=document.querySelector('.day[data-day="'+d+'"]');cur=d;
      if(has){markDay();scrollToDay(d,true)}else{render();scrollToDay(d,false)}
    }else{cur=d;render(false,true)}
    return;
  }
  if((el=t.closest("nav button"))){setTab(el.dataset.t);return}
  if((el=t.closest("[data-f]"))){setFilt(el.dataset.f);return}
  if((el=t.closest("[data-xc]"))){expCat=el.dataset.xc;lsSet(XKEY,expCat);period(lastP);return}
  if((el=t.closest(".sr"))){openResult(el);return}
  if(t.closest("#todayBtn")){cur=today();render(false,true);
    if(tab==="log")scrollToDay(cur,true);else window.scrollTo(0,0);return}
  if(t.closest("#findBtn")){if(findOn)closeFind();else openFind();return}
  if(t.closest("#findClose")){closeFind();return}
  if(t.closest("#syncBtn")){sync(true);return}
  if(t.closest("#expBtn")){openSheet();return}
  if(t.closest("#fab")){if(findOn)closeFind(true);if(tab==="task")addTask();else addEntry(today(),"log");return}
  if((el=t.closest("[data-p]"))){period(el.dataset.p);return}
  if((el=t.closest("[data-a]")))act(el.dataset.a,el);
});

document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="q"){vFind();return}
  if(t.tagName==="TEXTAREA"&&t.id!=="out")fit(t);
  var k=t.dataset.k;if(!k||k==="t")return;
  var ti=t.closest("[data-i]"),tl=t.closest("[data-l]");
  var o=ti?find(S.tasks,ti.dataset.i):tl?find(S.logs,tl.dataset.l):null;
  if(!o)return;
  var was=ti?timeOf(o.text):false;
  o[k]=t.value;o.updated=Date.now();save();
  if(ti&&was!==timeOf(o.text))pending=true;   /* 캘린더 표시는 입력이 끝난 뒤 갱신 */
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(!t.classList||!t.classList.contains("tm"))return;
  var o=find(S.logs,t.closest("[data-l]").dataset.l);if(!o)return;
  var v=normT(t.value);
  if(v===null){t.value=o.t;toast("시각은 0930 또는 09:30처럼 입력해 주세요");return}
  t.value=v;
  if(v!==o.t){o.t=v;o.updated=Date.now();save();pending=true}
});
document.addEventListener("keydown",function(e){
  var t=e.target;
  if(e.key==="Escape"){
    if(menuFor)closeMenu();else if($("sheet").classList.contains("on"))closeSheet();else if(findOn)closeFind();
    return;
  }
  if(e.key!=="Enter"||e.isComposing||e.keyCode===229)return;
  if(t.classList.contains("ai")){e.preventDefault();toTask(t);return}
  if(t.classList.contains("tm")){e.preventDefault();t.blur();return}
  if(t.classList.contains("lab")){e.preventDefault();var ta=t.closest(".e").querySelector("textarea");if(ta)ta.focus();return}
  if(!e.shiftKey&&t.tagName==="TEXTAREA"&&t.closest(".t")){e.preventDefault();t.blur();return}
});
document.addEventListener("focusin",function(e){
  if(COARSE&&$("view").contains(e.target)&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName))document.body.classList.add("typing");
});
document.addEventListener("focusout",function(e){
  var t=e.target,box=t&&t.closest?t.closest("[data-i],[data-l]"):null;
  setTimeout(function(){
    if(!editing())document.body.classList.remove("typing");
    if(pending&&!editing()){pending=false;render(true)}
  },0);
  if(box){
    var name=box.dataset.i?"tasks":"logs",id=box.dataset.i||box.dataset.l;
    setTimeout(function(){cleanEmpty(name,id)},250);
  }
});

/* 기록 화면에서 스크롤하면 위 날짜 띠가 따라감 */
var spyRaf=0;
window.addEventListener("scroll",function(){
  if(menuFor&&Math.abs(window.scrollY-menuY)>12)closeMenu();   /* 손으로 스크롤할 때만 닫음 */
  if(tab!=="log"||findOn||spyRaf)return;
  spyRaf=requestAnimationFrame(function(){
    spyRaf=0;
    var line=$("strip").getBoundingClientRect().bottom+16,secs=document.querySelectorAll(".day"),d=null;
    for(var i=0;i<secs.length;i++){if(secs[i].getBoundingClientRect().top<=line)d=secs[i].dataset.day;else break}
    if(!d&&secs[0])d=secs[0].dataset.day;
    if(d&&d!==cur){cur=d;markDay()}
  });
},{passive:true});
window.addEventListener("resize",function(){closeMenu();setSTH()});

$("fin").addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(String(r.result).replace(/^﻿/,""));
      if(!d||(!d.tasks&&!d.logs&&!d.meets))throw 0;
      /* 백업이 같거나 더 최신이고 내용이 다르면 되살림. 되살린 항목은 지금 시각으로 바꿔 서버에도 반영 */
      var c=cleanAll(d),now=Date.now(),n=0;
      NAMES.forEach(function(nm){
        var idx={};S[nm].forEach(function(o,i){idx[o.id]=i});
        c[nm].forEach(function(b){
          var i=idx[b.id];
          if(i===undefined){b.updated=now;S[nm].push(b);n++;return}
          var loc=S[nm][i];
          if(b.updated<loc.updated||sameItem(nm,loc,b))return;
          b.updated=now;if(loc.calId)b.calId=loc.calId;S[nm][i]=b;n++;
        });
      });
      migrate();save();closeSheet();render();
      alert(n?n+"개 항목을 되살렸습니다.":"바뀐 항목이 없습니다.");
      if(n&&SYNC)sync(false);
    }catch(err){alert("읽을 수 없는 파일입니다.")}
  };
  r.readAsText(f);e.target.value="";
});
